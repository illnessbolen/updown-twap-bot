# Скопируй в config.toml. Все значения стартовые, их нужно калибровать на записанных данных.
# Неизвестный ключ или неверный тип - ошибка при запуске (защита от опечаток).

[general]
dry_run = true              # live возможен только если dry_run = false И DRY_RUN=0 И --live И файл LIVE_OK
profile = "conservative"    # conservative | moderate | aggressive
symbols = ["btcusd", "ethusd"]   # символы PolyBolt: нижний регистр, суффикс usd (не btc/usd)
windows = [5, 15]           # минуты. Оба типа рынков рассчитываются по Chainlink TWAP 60 с (docs/API_NOTES.md, §0)
log_dir = "~/.updown-bot/data"   # записи: <папка>/ГГГГ-ММ-ДД/*.jsonl.gz (дата по UTC). Вне папки проекта,
                            # чтобы данные не пропали при обновлении. Windows: C:\Users\<имя>\.updown-bot\data
db_path = "bot.db"

[feed]
url = "wss://ws-live-v2.polymarket.com/ws"   # PolyBolt; нужны POLY_API_KEY/SECRET/PASSPHRASE в окружении или .env
twap_window_sec = 60        # другого окна PolyBolt не отдаёт
stale_after_sec = 45        # нет данных или цена старше этого: переподключение и пауза входов
reconnect_backoff_sec = [1, 2, 5, 10, 30]
use_spot_for_sigma = true   # sigma по споту, а не по сглаженному TWAP
spot_provider = "chainlink" # "chainlink" | "pyth" | "" (по умолчанию сервера)

[markets]
gamma_url = "https://gamma-api.polymarket.com"
refresh_sec = 30            # как часто перечитывать список рынков из Gamma
lookahead_min = 20          # заранее подгружать рынки, которые начнутся в ближайшие N минут
strike_settle_sec = 3       # через сколько секунд после начала окна фиксировать strike (поток TWAP запаздывает ~1.5 с)
strike_max_gap_sec = 2      # если принта ровно на границе нет, взять последний не старше N с; иначе strike неизвестен

[book]
url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
ping_sec = 10               # PING по документации каждые 10 с
stale_after_sec = 30        # нет данных стакана дольше этого: переподключение
subscribe_before_start_sec = 60   # подписываться на стакан рынка за N с до начала окна
keep_after_end_sec = 30     # и держать подписку N с после конца

[record]
compress = true             # писать .jsonl.gz: примерно в 8-10 раз меньше места
book_levels = 10            # сколько уровней стакана записывать с каждой стороны
book_every_sec = 1.0        # снимок стакана не чаще раза в N с на токен (и только если он изменился)

[signal]
min_prints = 20
cost = 0.02                 # запас на спред и проскальзывание, доля цены контракта (комиссия считается отдельно, fees.py)
min_secs_left_windows = 2   # не входить, если до расчёта меньше N окон TWAP

[execution]
prefer_maker = true         # сначала пробовать лимитный вход без пересечения спреда
order_ttl_sec = 10          # через сколько отменять неисполненный вход
stop_slip_floor = 0.03      # нижняя граница цены для агрессивного стопа

[paper]
latency_ms = 300            # задержка между сигналом и исполнением (taker delay на крипторынках сейчас 150 мс)
fill_only_on_book = true    # исполнять только по доступному объёму стакана

[profiles.conservative]
min_edge = 0.05
position_usd = 5
max_concurrent = 1
daily_loss_limit_usd = 10
stop_pct = 0.03
min_book_depth_usd = 300
max_spread = 0.01

[profiles.moderate]
min_edge = 0.035
position_usd = 10
max_concurrent = 2
daily_loss_limit_usd = 25
stop_pct = 0.04
min_book_depth_usd = 200
max_spread = 0.015

[profiles.aggressive]
min_edge = 0.02
position_usd = 20
max_concurrent = 4
daily_loss_limit_usd = 50
stop_pct = 0.05
min_book_depth_usd = 100
max_spread = 0.02

[monitor]
kill_switch_file = "KILL"   # если файл существует, новые входы запрещены, открытые позиции закрываются
report_every_min = 60
