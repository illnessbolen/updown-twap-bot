[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "updown-twap-bot"
version = "0.1.0"
description = "Polymarket Up/Down BTC/ETH bot: Chainlink TWAP edge after fees (paper by default)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# только для scripts/get_clob_api_key.py (одноразовое получение API-ключа)
keys = ["eth-account>=0.13,<1"]

[tool.setuptools]
packages = ["updown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
