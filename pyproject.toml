[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "updown-twap-bot"
version = "0.1.0"
description = "Polymarket Up/Down 5m/15m: edge по Chainlink TWAP после комиссий (бумажная торговля по умолчанию)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
]

[project.scripts]
updown-bot = "main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
py-modules = ["config", "fees", "feed", "recorder", "main", "twap_signal", "store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
